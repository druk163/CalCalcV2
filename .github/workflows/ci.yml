name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ЭТАП 1: Линтер (Lint) - статический анализ кода
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Run flake8 (style check)
      run: flake8 client/ --count --max-line-length=127 --statistics
    
    - name: Run black (format check)
      run: black --check --diff client/ --line-length 100

  # ЭТАП 2: Тестирование (Test)
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt 2>/dev/null || true
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=client --cov-report=xml --cov-report=term
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # ЭТАП 3: Сборка (Build) - создание артефакта
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller
        pip install -r requirements.txt 2>/dev/null || true
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name calcalc --add-data "client:client" client/main.py || \
        echo "Building main.py, if it fails, will try alternative"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: calcalc-linux
        path: dist/calcalc
        if-no-files-found: warn
